name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
        env:
          CAPTURE_TERRAIN: '1'

      - name: Terrain visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-visual-review
          path: test-results/terrain/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build
